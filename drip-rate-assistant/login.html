<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | Drip-Rate Assistant</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <!-- Auth Header -->
        <header class="app-header auth-header">
            <div class="header-left">
                <i data-lucide="droplets" class="app-icon"></i>
                <div class="app-title-group">
                    <h1>Drip-Rate Assistant</h1>
                    <span class="app-subtitle">Burn Resuscitation CDS</span>
                </div>
            </div>
            <div class="header-right">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle theme">
                    <i data-lucide="moon" class="theme-icon-moon"></i>
                    <i data-lucide="sun" class="theme-icon-sun hidden"></i>
                </button>
            </div>
        </header>

        <!-- Login Card -->
        <main class="auth-main">
            <section class="panel auth-card" id="login-panel">
                <header class="panel-header text-center">
                    <h2><i data-lucide="user"></i> Doctor Login</h2>
                </header>
                <div class="panel-body">
                    <form id="login-form" class="form-grid single-col">
                        <div class="form-group">
                            <label for="doctor-email">Email Address</label>
                            <input type="email" id="doctor-email" placeholder="dr.smith@hospital.com" required>
                        </div>
                        <div class="form-group">
                            <label for="doctor-password">Password</label>
                            <input type="password" id="doctor-password" placeholder="••••••••" required>
                        </div>
                        <div id="login-error" class="alert alert-warning hidden mt-3">
                            <i data-lucide="alert-circle"></i>
                            <p id="login-error-text">Invalid login credentials.</p>
                        </div>
                        <div class="form-group mt-4">
                            <button type="submit" class="btn btn-primary w-full" id="login-btn">
                                <i data-lucide="log-in" class="mr-2"></i> Login Security
                            </button>
                        </div>
                        <div class="auth-footer-links mt-4 text-center">
                            <a href="#" class="text-sm text-primary">Forgot Password?</a>
                            <p class="text-sm text-muted mt-2">Authorized clinical personnel only.</p>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
